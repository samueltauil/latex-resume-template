name: build latex resume
on: [push]

permissions:
  contents: write

env:
  TEX_FILE: my-resume.tex
  PDF_FILE: my-resume.pdf

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4
      
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: ${{ env.TEX_FILE }}
     
      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: ${{ env.PDF_FILE }}
      
      - name: Commit and Push PDF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions"
          git add ${PDF_FILE}
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated build of resume"
            git push https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git HEAD:${GITHUB_REF#refs/heads/}
          fi
